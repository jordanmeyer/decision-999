<!doctype html><html lang="en"><head><meta charset="utf-8"><title>320px optimizer QA</title><style>body{margin:0}iframe{width:320px;height:1100px;border:0;display:block}pre{white-space:pre-wrap}</style></head><body><iframe title="320px optimizer"></iframe><details><summary>Layout diagnostics</summary><button id="measure">Measure completed layout</button><pre id="qa">Loading…</pre></details><script>
const frame=document.querySelector('iframe');frame.src=location.pathname.includes('/tests/')?'/app/':'./index.html';
async function measure(){const w=frame.contentWindow,d=frame.contentDocument;await d.fonts.ready;document.querySelector('#qa').textContent=JSON.stringify({width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,height:d.documentElement.scrollHeight,fonts:[...d.fonts].map(f=>({family:f.family,status:f.status})),requests:w.performance.getEntriesByType('resource').map(r=>r.name),controls:[...d.querySelectorAll('button,input,summary,a')].filter(e=>e.getClientRects().length).filter(e=>e.getBoundingClientRect().height<24).map(e=>e.textContent)},null,2);}
frame.addEventListener('load',measure);document.querySelector('#measure').addEventListener('click',measure);
</script></body></html>
