<!doctype html><html lang="en"><meta charset="utf-8"><title>Launch Ledger production layouts</title><style>body{margin:20px;background:#ddd;font:16px Arial}iframe{display:block;border:1px solid #666;margin-bottom:24px}h1{font-size:20px}</style><h1>Desktop 1440 × 1000</h1><iframe title="Desktop app" src="/bab-example-roadmap/" width="1440" height="1000"></iframe><h1>Narrow 390 × 1000</h1><iframe title="Narrow app" src="/bab-example-roadmap/" width="390" height="1000"></iframe><h1>Small 320 × 900</h1><iframe title="Small app" src="/bab-example-roadmap/" width="320" height="900"></iframe></html>
<script>const width=Number(new URLSearchParams(location.search).get('width'));if([320,390,1440].includes(width)){for(const frame of document.querySelectorAll('iframe')){if(Number(frame.width)!==width){frame.previousElementSibling.remove();frame.remove();}}}</script>
<script>
for (const frame of document.querySelectorAll('iframe')) frame.addEventListener('load',async()=>{
  const d=frame.contentDocument,w=frame.contentWindow;
  await d.fonts.ready;
  const report=document.createElement('pre'); report.style.whiteSpace='pre-wrap';
  report.textContent=JSON.stringify({width:w.innerWidth,pageWidth:d.documentElement.scrollWidth,pageHeight:d.documentElement.scrollHeight,fonts:Array.from(d.fonts,f=>({family:f.family,weight:f.weight,status:f.status})),resources:w.performance.getEntriesByType('resource').map(r=>r.name)},null,2);
  frame.after(report);
});
</script>
