<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${title}</title>
  <meta name="description" content="${description}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="${title}">
  <meta property="og:description" content="${description}">
  <meta property="og:url" content="${url}">${image}
  <meta name="theme-color" content="#012169">
  <link rel="stylesheet" href="${base}style.css?v=${css}">
  <script src="${base}main.js?v=${js}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <a class="brand" href="${base}"><span class="brand-name">${name}</span><span class="brand-course">${course}</span></a>
      <nav aria-label="Main"><a href="${base}#plugins">Plugins</a><a href="${base}install/">Install</a></nav>
    </div>
  </header>
  <main id="main">
${content}
  </main>
  <footer class="footer">
    <div class="wrap footer-inner">
      <p><strong>${name}</strong> · ${course}</p>
      <p>Independent demonstration · <a href="https://github.com/${repo}">Source on GitHub</a></p>
    </div>
  </footer>
  <p id="copy-status" class="sr-only" role="status"></p>
</body>
</html>
