<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${title}</title>
  <meta name="description" content="${description}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="${title}">
  <meta property="og:description" content="${description}">
  <meta property="og:url" content="${url}">${image}
  <meta name="theme-color" content="#012169">
  <link rel="stylesheet" href="${base}style.css?v=${css}">
  <script src="${base}main.js?v=${js}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <a class="brand" href="${base}">${name}</a>
      <nav aria-label="Main">${nav}</nav>
    </div>
  </header>
  <main id="main">
${content}
  </main>
  <footer class="footer">
    <div class="wrap footer-inner">
      <div class="footer-brand"><a class="brand" href="${base}">${name}</a><p>${summary}</p></div>
      <nav aria-label="Footer">
        <div><h2>Directory</h2><a href="${base}plugins/">Plugins</a><a href="${base}install/">Install</a><a href="${base}about/">About</a></div>
        <div><h2>Project</h2><a href="https://github.com/${repo}">Source on GitHub</a><a href="https://agent-plugins.org/specification">Agent Plugins format</a></div>
      </nav>
    </div>
    <p class="wrap footer-base">Designed with the <a href="${base}plugins/duke-designer/">Duke Designer</a> plugin.</p>
  </footer>
  <p id="copy-status" class="sr-only" role="status"></p>
</body>
</html>
